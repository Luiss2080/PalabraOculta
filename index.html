<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ahorcado 🎯</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="contenedor">
    <h1>🎯 Ahorcado</h1>
    <p class="categoria">Categoría: <strong id="categoria"></strong></p>

    <svg id="dibujo" viewBox="0 0 200 200" width="160" height="160">
      <line x1="20" y1="180" x2="120" y2="180" stroke="#333" stroke-width="4"/>
      <line x1="50" y1="180" x2="50" y2="20" stroke="#333" stroke-width="4"/>
      <line x1="50" y1="20" x2="130" y2="20" stroke="#333" stroke-width="4"/>
      <line x1="130" y1="20" x2="130" y2="40" stroke="#333" stroke-width="4"/>
      <circle id="parte-cabeza" cx="130" cy="55" r="15" stroke="#333" stroke-width="3" fill="none" hidden/>
      <line id="parte-cuerpo" x1="130" y1="70" x2="130" y2="120" stroke="#333" stroke-width="3" hidden/>
      <line id="parte-brazo-izq" x1="130" y1="85" x2="110" y2="105" stroke="#333" stroke-width="3" hidden/>
      <line id="parte-brazo-der" x1="130" y1="85" x2="150" y2="105" stroke="#333" stroke-width="3" hidden/>
      <line id="parte-pierna-izq" x1="130" y1="120" x2="110" y2="150" stroke="#333" stroke-width="3" hidden/>
      <line id="parte-pierna-der" x1="130" y1="120" x2="150" y2="150" stroke="#333" stroke-width="3" hidden/>
    </svg>

    <p class="palabra" id="palabra"></p>
    <p class="info">Intentos restantes: <strong id="restantes"></strong></p>

    <div class="teclado" id="teclado"></div>

    <p class="resultado" id="resultado" hidden></p>
    <button id="btn-reiniciar">🔄 Jugar de nuevo</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
